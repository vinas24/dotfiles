#Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set-option -sa terminal-overrides "xterm*:Tc"
set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

unbind C-b
set -g prefix C-Space
bind C-space send-prefix

#For prefix key hightlighting
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'
#For vim navigation
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# copy mode
setw -g mode-style 'fg=black bg=red bold'
# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'
# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '
# messages
set -g message-style 'fg=yellow bg=red bold'
# popups and menus (display-menu, display-popup)
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=colour244"
set -g menu-style "bg=default,fg=default"
set -g menu-selected-style "bg=colour238,fg=white"
set -g menu-border-style "fg=colour244"

# bind '"' split-window -v -c "#{pane_current_path}
# bind % split-window -h -c "#{pane_current_path}
bind r source-file ~/.tmux.conf
run '~/.tmux/plugins/tpm/tpm'
source-file -q "$XDG_CONFIG_HOME/tmux/themes/noctalia.conf"
